<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>True Multiplayer Flappy Duck</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    body {
      margin: 0;
      background: #4ec0ca;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #ui {
      margin-bottom: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      user-select: none;
    }

    #name {
      padding: 5px;
      border-radius: 4px;
      border: none;
      outline: none;
      font-weight: bold;
    }

    canvas {
      display: block;
      background: #70c5ce;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="ui">
    Name: <input id="name" value="Duck" maxlength="10">
    <span style="margin-left: 20px;">Score: <span id="scoreVal">0</span></span>
  </div>

  <canvas id="game" width="400" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io(window.location.origin);
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("scoreVal");
    const nameInput = document.getElementById("name");

    const CanvasWidth = 400;
    const CanvasHeight = 600;

    const Gravity = 750;
    const Jump = -240;
    const ForwardSpeed = 120;
    const BirdRadius = 14;

    const PipeGap = 150;
    const PipeWidth = 52;
    const PipeSpawnDistance = 220;
    const PipeMinTop = 70;
    const PipeMaxTop = 360;

    const SnapshotDelay = 100;
    const MaxHistory = 12;
    const DeadTimeout = 5000;
    const OffscreenPad = 80;

    let Players = {};
    let RemoteBuffer = {};
    let IsGameOver = false;
    let Score = 0;

    let Bird = {
      worldX: 120,
      y: 240,
      vy: 0,
      radius: BirdRadius
    };

    let CameraX = 0;
    let Pipes = [];
    let NextPipeX = 420;
    let CurrentBlockTime = Math.floor(Date.now() / 60000) * 60;
    let PipeSequenceCounter = 0;
    let Last = performance.now();
    let NetworkTimer = 0;

    function SeededRandom(Seed) {
      let X = Math.sin(Seed) * 10000;
      return X - Math.floor(X);
    }

    function CreatePipePair(PipeX, Seed) {
      const RandomValue = SeededRandom(Seed);
      const TopHeight = Math.floor(RandomValue * (PipeMaxTop - PipeMinTop)) + PipeMinTop;

      return {
        x: PipeX,
        top: TopHeight,
        bottom: TopHeight + PipeGap,
        passed: false
      };
    }

    function PushSnapshot(Id, Data) {
      if (!RemoteBuffer[Id]) {
        RemoteBuffer[Id] = [];
      }

      RemoteBuffer[Id].push({
        x: Data.x,
        y: Data.y,
        score: Data.score || 0,
        isDead: !!Data.isDead,
        name: Data.name || "Duck",
        t: Date.now()
      });

      while (RemoteBuffer[Id].length > MaxHistory) {
        RemoteBuffer[Id].shift();
      }
    }

    function SendJoin() {
      if (!socket.connected) return;

      socket.emit("join-game", {
        name: nameInput.value || "Duck",
        x: Bird.worldX,
        y: Bird.y,
        score: Score,
        isDead: IsGameOver
      });
    }

    socket.on("connect", () => {
      SendJoin();
    });

    socket.on("current-players", (ServerPlayers) => {
      Players = ServerPlayers || {};
      RemoteBuffer = {};

      const Now = Date.now();
      for (const Id in ServerPlayers) {
        RemoteBuffer[Id] = [{
          x: ServerPlayers[Id].x,
          y: ServerPlayers[Id].y,
          score: ServerPlayers[Id].score || 0,
          isDead: !!ServerPlayers[Id].isDead,
          name: ServerPlayers[Id].name || "Duck",
          t: Now
        }];
      }
    });

    socket.on("player-joined", (Player) => {
      Players[Player.id] = Player;
      PushSnapshot(Player.id, Player);
    });

    socket.on("player-state", (Player) => {
      Players[Player.id] = Player;
      PushSnapshot(Player.id, Player);
    });

    socket.on("player-disconnected", (Id) => {
      delete Players[Id];
      delete RemoteBuffer[Id];
    });

    function EmitNetworkUpdate() {
      if (!socket.connected) return;

      socket.emit("update-position", {
        x: Bird.worldX,
        y: Bird.y,
        score: Score,
        isDead: IsGameOver,
        name: nameInput.value || "Duck"
      });
    }

    function ResetGame() {
      Bird.worldX = 120;
      Bird.y = 240;
      Bird.vy = 0;
      IsGameOver = false;
      Score = 0;
      scoreElement.innerText = Score;
      CurrentBlockTime = Math.floor(Date.now() / 60000) * 60;
      PipeSequenceCounter = 0;
      Pipes = [];
      NextPipeX = 420;
      CameraX = 0;
      SendJoin();
      EmitNetworkUpdate();
    }

    function GetInterpolatedRemotePlayer(History, RenderTime) {
      if (!History || History.length === 0) return null;
      if (History.length === 1) return History[0];

      if (RenderTime <= History[0].t) return History[0];
      if (RenderTime >= History[History.length - 1].t) return History[History.length - 1];

      let A = History[0];
      let B = History[1];

      for (let i = 0; i < History.length - 1; i++) {
        if (History[i].t <= RenderTime && History[i + 1].t >= RenderTime) {
          A = History[i];
          B = History[i + 1];
          break;
        }
      }

      const Span = Math.max(1, B.t - A.t);
      const Alpha = Math.min(1, Math.max(0, (RenderTime - A.t) / Span));

      return {
        x: A.x + (B.x - A.x) * Alpha,
        y: A.y + (B.y - A.y) * Alpha,
        score: B.score,
        isDead: B.isDead,
        name: B.name
      };
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (IsGameOver) {
          ResetGame();
        } else {
          Bird.vy = Jump;
        }
      }
    });

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (IsGameOver) {
        ResetGame();
      } else {
        Bird.vy = Jump;
      }
    }, { passive: false });

    nameInput.addEventListener("input", () => {
      SendJoin();
    });

    function EnsurePipesAhead() {
      while (Pipes.length === 0 || Pipes[Pipes.length - 1].x < Bird.worldX + 1200) {
        PipeSequenceCounter++;
        const Seed = CurrentBlockTime + PipeSequenceCounter;
        Pipes.push(CreatePipePair(NextPipeX, Seed));
        NextPipeX += PipeSpawnDistance;
      }
    }

    function Loop(T) {
      const Dt = Math.min(0.033, (T - Last) / 1000);
      Last = T;

      ctx.clearRect(0, 0, CanvasWidth, CanvasHeight);

      if (!IsGameOver) {
        Bird.worldX += ForwardSpeed * Dt;
        Bird.vy += Gravity * Dt;
        Bird.y += Bird.vy * Dt;

        if (Bird.y > 585) {
          Bird.y = 585;
          IsGameOver = true;
        }

        if (Bird.y < 0) {
          Bird.y = 0;
          Bird.vy = 0;
        }

        EnsurePipesAhead();

        for (let i = Pipes.length - 1; i >= 0; i--) {
          const P = Pipes[i];

          if (!P.passed && Bird.worldX > P.x + PipeWidth) {
            P.passed = true;
            Score++;
            scoreElement.innerText = Score;
          }

          const BirdLeft = Bird.worldX - BirdRadius;
          const BirdRight = Bird.worldX + BirdRadius;
          const BirdTop = Bird.y - BirdRadius;
          const BirdBottom = Bird.y + BirdRadius;

          const PipeLeft = P.x;
          const PipeRight = P.x + PipeWidth;

          if (BirdRight > PipeLeft && BirdLeft < PipeRight) {
            if (BirdTop < P.top || BirdBottom > P.bottom) {
              IsGameOver = true;
            }
          }

          if (P.x + PipeWidth < Bird.worldX - 500) {
            Pipes.splice(i, 1);
          }
        }
      }

      CameraX = Math.max(0, Bird.worldX - 120);

      NetworkTimer += Dt;
      if (NetworkTimer > 0.05) {
        NetworkTimer = 0;
        EmitNetworkUpdate();
      }

      for (const P of Pipes) {
        const ScreenX = Math.floor(P.x - CameraX);

        if (ScreenX < -100 || ScreenX > CanvasWidth + 100) continue;

        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(ScreenX, 0, PipeWidth, P.top);
        ctx.strokeStyle = "#538122";
        ctx.lineWidth = 3;
        ctx.strokeRect(ScreenX, -5, PipeWidth, P.top + 5);

        ctx.fillRect(ScreenX, P.bottom, PipeWidth, CanvasHeight - P.bottom);
        ctx.strokeRect(ScreenX, P.bottom, PipeWidth, CanvasHeight - P.bottom + 5);
      }

      const BirdScreenX = Bird.worldX - CameraX;

      ctx.beginPath();
      ctx.arc(BirdScreenX, Bird.y, BirdRadius, 0, Math.PI * 2);
      ctx.fillStyle = "#f5d323";
      ctx.fill();
      ctx.strokeStyle = "#d4b200";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = "#ff9a00";
      ctx.ellipse(BirdScreenX + 10, Bird.y + 2, 8, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(BirdScreenX + 4, Bird.y - 4, 2, 0, Math.PI * 2);
      ctx.fillStyle = "black";
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(nameInput.value || "Duck", BirdScreenX, Bird.y - 20);

      const RenderTime = Date.now() - SnapshotDelay;

      for (const Id in RemoteBuffer) {
        if (Id === socket.id) continue;

        const History = RemoteBuffer[Id];
        if (!History || History.length === 0) continue;

        const Latest = History[History.length - 1];
        if (Date.now() - Latest.t > DeadTimeout) continue;
        if (Latest.isDead) continue;

        const Remote = GetInterpolatedRemotePlayer(History, RenderTime);
        if (!Remote) continue;

        const RemoteScreenX = Remote.x - CameraX;

        if (RemoteScreenX < -OffscreenPad || RemoteScreenX > canvas.width + OffscreenPad) continue;

        ctx.beginPath();
        ctx.arc(RemoteScreenX, Remote.y, BirdRadius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(235, 80, 80, 0.75)";
        ctx.fill();
        ctx.strokeStyle = "rgba(180, 40, 40, 0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = "#ff9a00";
        ctx.ellipse(RemoteScreenX + 10, Remote.y + 2, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.font = "bold 11px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`${Remote.name || "Duck"} (${Remote.score || 0})`, RemoteScreenX, Remote.y - 20);
      }

      if (IsGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, CanvasWidth, CanvasHeight);
        ctx.fillStyle = "white";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 200, 260);
        ctx.font = "16px Arial";
        ctx.fillText("Press Space or Tap Screen to Restart", 200, 310);
      }

      requestAnimationFrame(Loop);
    }

    EnsurePipesAhead();
    requestAnimationFrame(Loop);
  </script>
</body>
</html>
