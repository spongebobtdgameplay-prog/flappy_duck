<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Duck</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    overflow:hidden;
}

#gameCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:linear-gradient(to bottom,#0ea5e9,#1e293b);
}

#mainMenu{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    background:rgba(15,23,42,.96);
    border:2px solid #38bdf8;
    border-radius:20px;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:0 0 40px rgba(56,189,248,.4);
}

.title{
    font-size:42px;
    font-weight:900;
    text-align:center;
    color:#38bdf8;
    text-shadow:0 0 20px #38bdf8;
}

button{
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
    background:#1e293b;
    color:white;
}

button:hover{
    transform:scale(1.03);
    background:#334155;
}

.primary{
    background:#0ea5e9;
}

.primary:hover{
    background:#38bdf8;
}

.panel{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:520px;
    max-height:80vh;
    overflow-y:auto;
    background:#111827;
    border:2px solid #38bdf8;
    border-radius:18px;
    padding:20px;
    display:none;
    flex-direction:column;
    gap:12px;
}

.panel h2{
    text-align:center;
    color:#38bdf8;
}

.closeButton{
    background:#ef4444;
}

input,textarea,select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background:#1e293b;
    color:white;
    font-size:16px;
}

textarea{
    min-height:120px;
    resize:none;
}

.card{
    background:#1e293b;
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.small{
    opacity:.7;
    font-size:13px;
}

.voteRow{
    display:flex;
    gap:10px;
}

.topBar{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:100;
}

.stats{
    background:rgba(15,23,42,.9);
    padding:12px 18px;
    border-radius:14px;
    border:1px solid #38bdf8;
    display:flex;
    gap:18px;
    font-weight:700;
}

.settingsButton{
    width:60px;
    height:60px;
    border-radius:50%;
    font-size:28px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div class="topBar">
    <div class="stats">
        <div>Score: <span id="scoreText">0</span></div>
        <div>Best: <span id="bestText">0</span></div>
        <div>Coins: <span id="coinsText">0</span></div>
    </div>

    <button class="settingsButton" onclick="openPanel('settingsPanel')">
        ⚙
    </button>
</div>

<div id="mainMenu">
    <div class="title">FLAPPY DUCK</div>

    <button class="primary" onclick="startGame()">
        PLAY
    </button>

    <button onclick="openPanel('leaderboardPanel')">
        LEADERBOARDS
    </button>

    <button onclick="openPanel('suggestionPanel')">
        SUGGESTIONS
    </button>

    <button onclick="openPanel('reportPanel')">
        REPORTS
    </button>

    <button onclick="openPanel('teamPanel')">
        TEAMS
    </button>
</div>

<div id="settingsPanel" class="panel">
    <h2>SETTINGS</h2>

    <input id="usernameInput" placeholder="Username">

    <input id="passwordInput" type="password" placeholder="Password">

    <button onclick="login()">
        LOGIN
    </button>

    <button onclick="createAccount()">
        CREATE ACCOUNT
    </button>

    <button onclick="logout()">
        LOGOUT
    </button>

    <button class="closeButton" onclick="closePanels()">
        CLOSE
    </button>
</div>

<div id="leaderboardPanel" class="panel">
    <h2>LEADERBOARDS</h2>

    <div id="leaderboardList"></div>

    <button class="closeButton" onclick="closePanels()">
        CLOSE
    </button>
</div>

<div id="reportPanel" class="panel">
    <h2>REPORT PLAYER</h2>

    <select id="reportCategory">
        <option>Hacker</option>
        <option>Bug</option>
        <option>Cheat</option>
        <option>Other</option>
    </select>

    <input id="reportTitle" placeholder="Title">

    <textarea id="reportDetails" placeholder="Details"></textarea>

    <button onclick="submitReport()">
        SUBMIT REPORT
    </button>

    <div id="reportList"></div>

    <button class="closeButton" onclick="closePanels()">
        CLOSE
    </button>
</div>

<div id="suggestionPanel" class="panel">
    <h2>SUGGESTIONS</h2>

    <select id="suggestionCategory">
        <option>Gameplay</option>
        <option>Shop</option>
        <option>Teams</option>
        <option>UI</option>
        <option>Multiplayer</option>
        <option>Other</option>
    </select>

    <input id="suggestionTitle" placeholder="Title">

    <textarea id="suggestionDetails" placeholder="Suggestion"></textarea>

    <button onclick="submitSuggestion()">
        SUBMIT SUGGESTION
    </button>

    <div id="suggestionList"></div>

    <button class="closeButton" onclick="closePanels()">
        CLOSE
    </button>
</div>

<div id="teamPanel" class="panel">
    <h2>TEAMS</h2>

    <input id="teamName" placeholder="Team Name">

    <button onclick="createTeam()">
        CREATE TEAM
    </button>

    <div id="teamList"></div>

    <button class="closeButton" onclick="closePanels()">
        CLOSE
    </button>
</div>

<script>
const canvas = document.getElementById("gameCanvas")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let birdY = 300
let velocity = 0
let gravity = 0.55
let flapPower = -9
let score = 0
let best = Number(localStorage.getItem("bestScore") || 0)
let coins = Number(localStorage.getItem("coins") || 0)
let pipes = []
let playing = false

document.getElementById("bestText").textContent = best
document.getElementById("coinsText").textContent = coins

function resetGame(){
    birdY = 300
    velocity = 0
    score = 0
    pipes = []
}

function startGame(){
    resetGame()
    playing = true
    document.getElementById("mainMenu").style.display = "none"
}

function flap(){
    if(!playing) return
    velocity = flapPower
}

window.addEventListener("keydown",e=>{
    if(e.code === "Space"){
        flap()
    }
})

window.addEventListener("mousedown",()=>{
    flap()
})

function spawnPipe(){
    const gap = 220
    const topHeight = Math.random() * 350 + 60

    pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        scored:false
    })
}

setInterval(()=>{
    if(playing){
        spawnPipe()
    }
},1800)

function update(){
    requestAnimationFrame(update)

    ctx.clearRect(0,0,canvas.width,canvas.height)

    if(playing){
        velocity += gravity
        birdY += velocity

        ctx.fillStyle = "#facc15"
        ctx.beginPath()
        ctx.arc(180,birdY,24,0,Math.PI*2)
        ctx.fill()

        for(let i = pipes.length - 1; i >= 0; i--){
            const pipe = pipes[i]
            pipe.x -= 5

            ctx.fillStyle = "#22c55e"
            ctx.fillRect(pipe.x,0,90,pipe.top)

            ctx.fillRect(
                pipe.x,
                pipe.bottom,
                90,
                canvas.height - pipe.bottom
            )

            if(
                180 + 24 > pipe.x &&
                180 - 24 < pipe.x + 90 &&
                (
                    birdY - 24 < pipe.top ||
                    birdY + 24 > pipe.bottom
                )
            ){
                endGame()
            }

            if(pipe.x + 90 < 180 && !pipe.scored){
                pipe.scored = true
                score++
                coins++

                document.getElementById("scoreText").textContent = score
                document.getElementById("coinsText").textContent = coins

                localStorage.setItem("coins",coins)
            }

            if(pipe.x < -100){
                pipes.splice(i,1)
            }
        }

        if(birdY > canvas.height || birdY < -40){
            endGame()
        }
    }
}

function endGame(){
    playing = false

    if(score > best){
        best = score
        localStorage.setItem("bestScore",best)
    }

    document.getElementById("bestText").textContent = best
    document.getElementById("mainMenu").style.display = "flex"
}

update()

function closePanels(){
    document.querySelectorAll(".panel").forEach(panel=>{
        panel.style.display = "none"
    })
}

function openPanel(id){
    closePanels()
    document.getElementById(id).style.display = "flex"
}

async function createAccount(){
    const username = document.getElementById("usernameInput").value
    const password = document.getElementById("passwordInput").value

    const result = await runServerFunction("createAccount",{
        username,
        password
    })

    alert(result.message || result.error)
}

async function login(){
    const username = document.getElementById("usernameInput").value
    const password = document.getElementById("passwordInput").value

    const result = await runServerFunction("loginAccount",{
        username,
        password
    })

    alert(result.message || result.error)
}

async function logout(){
    const result = await runServerFunction("logoutAccount")
    alert(result.message || result.error)
}

async function submitSuggestion(){
    const category = document.getElementById("suggestionCategory").value
    const title = document.getElementById("suggestionTitle").value
    const details = document.getElementById("suggestionDetails").value

    const result = await runServerFunction("submitSuggestion",{
        category,
        title,
        details
    })

    alert(result.message || result.error)

    loadSuggestions()
}

async function loadSuggestions(){
    const data = await runServerFunction("getSuggestionData")

    const container = document.getElementById("suggestionList")
    container.innerHTML = ""

    ;(data.suggestions || []).forEach(item=>{
        const div = document.createElement("div")
        div.className = "card"

        div.innerHTML = `
            <h3>${item.title}</h3>
            <div>${item.details}</div>
            <div class="small">${item.category} • ${item.username}</div>
            <div class="voteRow">
                <button onclick="voteSuggestion('${item.id}','heart')">
                    ❤️ ${item.hearts}
                </button>

                <button onclick="voteSuggestion('${item.id}','dislike')">
                    👎 ${item.dislikes}
                </button>
            </div>
        `

        container.appendChild(div)
    })
}

async function voteSuggestion(id,reaction){
    await runServerFunction("voteSuggestion",{
        suggestionId:id,
        reaction
    })

    loadSuggestions()
}

async function submitReport(){
    const category = document.getElementById("reportCategory").value
    const title = document.getElementById("reportTitle").value
    const details = document.getElementById("reportDetails").value

    const result = await runServerFunction("submitReport",{
        category,
        title,
        details
    })

    alert(result.message || result.error)
}

async function createTeam(){
    const name = document.getElementById("teamName").value

    const result = await runServerFunction("createTeam",{
        name,
        maxPlayers:5
    })

    alert(result.message || result.error)
}

async function refreshLeaderboards(){
    const data = await runServerFunction("getLeaderboards")

    const container = document.getElementById("leaderboardList")
    container.innerHTML = ""

    ;(data.highscores || []).forEach((row,index)=>{
        const div = document.createElement("div")
        div.className = "card"

        div.innerHTML = `
            <div>#${index + 1} ${row.username}</div>
            <div>Best: ${row.best}</div>
            <div>Coins: ${row.coins}</div>
        `

        container.appendChild(div)
    })
}

function runServerFunction(name,data){
    return new Promise(resolve=>{
        if(typeof google !== "undefined"){
            google.script.run
                .withSuccessHandler(resolve)
                [name](data)
        }else{
            resolve({
                ok:true,
                message:"Node server placeholder active."
            })
        }
    })
}

loadSuggestions()
refreshLeaderboards()
</script>

</body>
</html>
