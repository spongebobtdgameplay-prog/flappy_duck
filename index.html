<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>True Multiplayer Flappy Duck</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    body {
      margin: 0;
      background: #4ec0ca;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #ui {
      margin-bottom: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      user-select: none;
    }
    #name {
      padding: 5px;
      border-radius: 4px;
      border: none;
      outline: none;
      font-weight: bold;
    }
    canvas {
      display: block;
      background: #70c5ce;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="ui">
    Name: <input id="name" value="Duck" maxlength="10">
    <span style="margin-left: 20px;">Score: <span id="scoreVal">0</span></span>
  </div>

  <canvas id="game" width="400" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const SERVER_URL = window.location.origin;
    const socket = io(SERVER_URL);

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("scoreVal");
    const nameInput = document.getElementById("name");

    let players = {};
    let playerStates = {};
    let isGameOver = false;
    let score = 0;

    let bird = { x: 100, y: 200, v: 0, radius: 14 };
    const gravity = 750;
    const jump = -240;

    let pipes = [];
    let pipeTimer = 0;
    const pipeSpawnRate = 1.8;
    const pipeSpeed = 140;
    const pipeGap = 140;

    let currentBlockTime = Math.floor(Date.now() / 60000) * 60;
    let pipeSequenceCounter = 0;

    const INTERP_DELAY = 0.08;
    const MAX_HISTORY = 12;
    const OFFSCREEN_PAD = 50;
    const STALE_PLAYER_TIMEOUT = 2500;

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function pushPlayerSample(id, data, timeStamp) {
      if (!playerStates[id]) {
        playerStates[id] = [];
      }

      playerStates[id].push({
        x: data.x,
        y: data.y,
        score: data.score || 0,
        isDead: !!data.isDead,
        name: data.name || "Duck",
        t: timeStamp
      });

      while (playerStates[id].length > MAX_HISTORY) {
        playerStates[id].shift();
      }
    }

    function updateLocalName() {
      if (socket.connected) {
        socket.emit("join-game", {
          name: nameInput.value || "Duck",
          x: bird.x,
          y: bird.y
        });
      }
    }

    socket.on("connect", () => {
      updateLocalName();
    });

    socket.on("current-players", (serverPlayers) => {
      const now = performance.now();

      players = serverPlayers || {};
      playerStates = {};

      for (const id in serverPlayers) {
        pushPlayerSample(id, serverPlayers[id], now);
      }
    });

    socket.on("player-joined", (newPlayer) => {
      const now = performance.now();
      players[newPlayer.id] = newPlayer;
      pushPlayerSample(newPlayer.id, newPlayer, now);
    });

    socket.on("player-disconnected", (removedId) => {
      delete players[removedId];
      delete playerStates[removedId];
    });

    socket.on("player-moved", (updatedPlayer) => {
      const now = performance.now();
      players[updatedPlayer.id] = updatedPlayer;
      pushPlayerSample(updatedPlayer.id, updatedPlayer, now);
    });

    function emitNetworkUpdate() {
      if (socket.connected) {
        socket.emit("update-position", {
          x: bird.x,
          y: bird.y,
          score: score,
          isDead: isGameOver
        });
      }
    }

    nameInput.addEventListener("input", () => {
      updateLocalName();
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (isGameOver) {
          resetGame();
        } else {
          bird.v = jump;
        }
      }
    });

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (isGameOver) {
        resetGame();
      } else {
        bird.v = jump;
      }
    });

    function resetGame() {
      bird.y = 200;
      bird.v = 0;
      pipes = [];
      pipeTimer = 0;
      score = 0;
      scoreElement.innerText = score;
      isGameOver = false;
      currentBlockTime = Math.floor(Date.now() / 60000) * 60;
      pipeSequenceCounter = 0;
      emitNetworkUpdate();
    }

    function getInterpolatedRemotePlayer(pid, renderTime) {
      const history = playerStates[pid];
      if (!history || history.length === 0) {
        return null;
      }

      if (history.length === 1) {
        return history[0];
      }

      let prev = history[0];
      let next = history[history.length - 1];

      for (let i = 0; i < history.length - 1; i++) {
        if (history[i].t <= renderTime && history[i + 1].t >= renderTime) {
          prev = history[i];
          next = history[i + 1];
          break;
        }
      }

      if (renderTime <= history[0].t) {
        return history[0];
      }

      if (renderTime >= history[history.length - 1].t) {
        return history[history.length - 1];
      }

      const span = next.t - prev.t;
      if (span <= 0) {
        return next;
      }

      const alpha = Math.min(1, Math.max(0, (renderTime - prev.t) / span));

      return {
        x: prev.x + (next.x - prev.x) * alpha,
        y: prev.y + (next.y - prev.y) * alpha,
        score: next.score,
        isDead: next.isDead,
        name: next.name
      };
    }

    let last = performance.now();
    let networkTimer = 0;

    function loop(t) {
      const dt = Math.min(0.033, (t - last) / 1000);
      last = t;

      ctx.clearRect(0, 0, 400, 600);

      if (!isGameOver) {
        bird.v += gravity * dt;
        bird.y += bird.v * dt;

        if (bird.y > 585) {
          bird.y = 585;
          isGameOver = true;
        }

        if (bird.y < 0) {
          bird.y = 0;
          bird.v = 0;
        }

        pipeTimer += dt;
        if (pipeTimer >= pipeSpawnRate) {
          pipeTimer = 0;
          pipeSequenceCounter++;

          const uniqueSeed = currentBlockTime + pipeSequenceCounter;
          const pseudoRandomValue = seededRandom(uniqueSeed);

          const minHeight = 60;
          const maxHeight = 360;
          const topHeight = Math.floor(pseudoRandomValue * (maxHeight - minHeight)) + minHeight;

          pipes.push({
            x: 400,
            top: topHeight,
            bottom: topHeight + pipeGap,
            passed: false
          });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= pipeSpeed * dt;

          if (p.x < -60) {
            pipes.splice(i, 1);
            continue;
          }

          if (!p.passed && p.x + 25 < bird.x) {
            p.passed = true;
            score++;
            scoreElement.innerText = score;
          }

          if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 50) {
            if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
              isGameOver = true;
            }
          }
        }
      }

      networkTimer += dt;
      if (networkTimer > 0.05) {
        networkTimer = 0;
        emitNetworkUpdate();
      }

      pipes.forEach(p => {
        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.strokeStyle = "#538122";
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x, -5, 50, p.top + 5);

        ctx.fillRect(p.x, p.bottom, 50, 600 - p.bottom);
        ctx.strokeRect(p.x, p.bottom, 50, 600 - p.bottom + 5);
      });

      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f5d323";
      ctx.fill();
      ctx.strokeStyle = "#d4b200";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = "#ff9a00";
      ctx.ellipse(bird.x + 10, bird.y + 2, 8, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(bird.x + 4, bird.y - 4, 2, 0, Math.PI * 2);
      ctx.fillStyle = "black";
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(nameInput.value || "Duck", bird.x, bird.y - 20);

      const renderTime = performance.now() - INTERP_DELAY * 1000;

      for (const pid in playerStates) {
        if (pid === socket.id) continue;

        const history = playerStates[pid];
        if (!history || history.length === 0) continue;

        const latest = history[history.length - 1];
        if (performance.now() - latest.t > STALE_PLAYER_TIMEOUT) continue;
        if (latest.isDead) continue;

        const remote = getInterpolatedRemotePlayer(pid, renderTime);
        if (!remote) continue;

        const x = remote.x;
        const y = remote.y;

        if (x < -OFFSCREEN_PAD || x > canvas.width + OFFSCREEN_PAD) continue;

        ctx.beginPath();
        ctx.arc(x, y, bird.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(235, 80, 80, 0.75)";
        ctx.fill();
        ctx.strokeStyle = "rgba(180, 40, 40, 0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = "#ff9a00";
        ctx.ellipse(x + 10, y + 2, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.font = "bold 11px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`${remote.name || "Duck"} (${remote.score || 0})`, x, y - 20);
      }

      if (isGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, 400, 600);
        ctx.fillStyle = "white";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 200, 260);
        ctx.font = "16px Arial";
        ctx.fillText("Press Space or Tap Screen to Restart", 200, 310);
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
