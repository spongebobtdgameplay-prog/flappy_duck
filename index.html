<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Multiplayer Fix</title>
<style>
body { margin:0; overflow:hidden; background:#4ec0ca; }
canvas { display:block; margin:auto; background:#70c5ce; }
</style>
</head>
<body>

<canvas id="c" width="400" height="600"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io();

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let bird = { x:100, y:200, v:0, dead:false };
let gravity = 700;
let jump = -250;

let players = {};
let buffer = {};

let pipes = [];
let pipeTimer = 0;
let pipeSpeed = 140;
let pipeGap = 140;

const MAX_BUFFER = 10;

socket.on("init", (data) => {
  players = data;
  buffer = {};

  for (const id in data) {
    buffer[id] = [{
      x: data[id].x,
      y: data[id].y,
      t: Date.now()
    }];
  }
});

socket.on("state", (p) => {
  if (!buffer[p.id]) buffer[p.id] = [];

  buffer[p.id].push({
    x: p.x,
    y: p.y,
    score: p.score,
    isDead: p.isDead,
    t: Date.now()
  });

  if (buffer[p.id].length > MAX_BUFFER) {
    buffer[p.id].shift();
  }

  players[p.id] = p;
});

socket.on("remove", (id) => {
  delete players[id];
  delete buffer[id];
});

function send() {
  socket.emit("update", {
    x: bird.x,
    y: bird.y,
    score: 0,
    isDead: bird.dead
  });
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    if (bird.dead) return;
    bird.v = jump;
  }
});

function reset() {
  bird.y = 200;
  bird.v = 0;
  bird.dead = false;
  pipes = [];
  socket.emit("update", {
    x: bird.x,
    y: bird.y,
    score: 0,
    isDead: false
  });
}

function getInterp(arr, time) {
  if (!arr || arr.length < 2) return arr?.[0];

  let a = arr[0], b = arr[1];

  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i].t <= time && arr[i+1].t >= time) {
      a = arr[i];
      b = arr[i+1];
      break;
    }
  }

  let t = (time - a.t) / Math.max(1, b.t - a.t);

  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t
  };
}

let last = performance.now();

function loop(t) {
  let dt = (t - last) / 1000;
  last = t;

  ctx.clearRect(0,0,400,600);

  // FREEZE WORLD ON DEATH (IMPORTANT FIX)
  if (!bird.dead) {

    bird.v += gravity * dt;
    bird.y += bird.v * dt;

    if (bird.y > 580) {
      bird.dead = true;
    }

    pipeTimer += dt;

    if (pipeTimer > 1.5) {
      pipeTimer = 0;
      let h = 100 + Math.random() * 250;

      pipes.push({
        x: 400,
        top: h,
        bottom: h + pipeGap
      });
    }

    for (let p of pipes) {
      p.x -= pipeSpeed * dt;
    }

    pipes = pipes.filter(p => p.x > -60);

    send();
  }

  // pipes ALWAYS render locally but stop updating on death
  for (let p of pipes) {
    ctx.fillStyle = "green";
    ctx.fillRect(p.x, 0, 50, p.top);
    ctx.fillRect(p.x, p.bottom, 50, 600);
  }

  // local player
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, 14, 0, Math.PI*2);
  ctx.fill();

  // remote players FIXED
  const renderTime = Date.now() - 80;

  for (const id in buffer) {
    if (id === socket.id) continue;

    const arr = buffer[id];
    if (!arr?.length) continue;

    const p = getInterp(arr, renderTime);
    if (!p) continue;

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 14, 0, Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
